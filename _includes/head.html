<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ config.description }}" />

    <title>
        {% if page.title %}
            {{ page.title | escape }}
        {% else %}
            {{ site.title | escape }}
        {% endif %}
    </title>

    <link rel="apple-touch-icon" sizes="180x180" href="/assets/manifest/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/manifest/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/manifest/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/assets/manifest/site.webmanifest" />
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/assets/css/styles.css" />

    <script src="/assets/js/bootstrap.min.js" type="text/javascript"></script>
    <script src="/assets/js/echarts.min.js" type="text/javascript"></script>
    <script src="/assets/js/functions.js" type="text/javascript"></script>
</head>
